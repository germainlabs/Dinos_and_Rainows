<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Dino Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-blue: #87CEEB;
            --grass-green: #4CAF50;
            --dirt-brown: #8B4513;
            --rainbow-red: #FF0000;
            --rainbow-orange: #FF7F00;
            --rainbow-yellow: #FFFF00;
            --rainbow-green: #00FF00;
            --rainbow-blue: #0000FF;
            --rainbow-purple: #8B00FF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background-color: var(--sky-blue);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #fff;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .screen {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            pointer-events: all;
            display: none;
            animation: fadeIn 0.5s ease-out;
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .screen.active {
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        button {
            background: white;
            color: #333;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin: 0.5rem;
        }

        button:hover {
            transform: scale(1.05);
            background: #f0f0f0;
        }

        #score-display,
        #level-display {
            position: absolute;
            top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        #score-display {
            right: 20px;
        }

        #level-display {
            left: 20px;
        }

        .char-selection {
            display: flex;
            gap: 1.5rem;
            margin: 1rem 0;
            pointer-events: all;
            justify-content: center;
        }

        .char-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            padding: 1rem;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
            width: 140px;
        }

        .char-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }

        .char-card.selected {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .char-preview {
            width: 80px;
            height: 80px;
            margin: 0 auto 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .char-name {
            font-weight: bold;
            font-size: 1rem;
        }

        .level-up-notice {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .level-up-notice.visible {
            opacity: 1;
            animation: bounceIn 0.8s cubic-bezier(0.36, 0, 0.66, -0.56) forwards;
        }

        @keyframes bounceIn {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 0;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }

            70% {
                transform: translate(-50%, -50%) scale(0.9);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="level-display">Level: 1</div>
        <div id="score-display">Score: 0</div>
        <div id="level-up-text" class="level-up-notice">LEVEL UP!</div>
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="start-screen" class="screen active">
                <h1>Rainbow Dino Run</h1>
                <p style="font-size: 0.9rem; opacity: 0.9;">Choose your character:</p>
                
                <div class="char-selection">
                    <div class="char-card selected" id="dino1-card">
                        <div class="char-preview" id="preview1"></div>
                        <div class="char-name">Dino Boy</div>
                    </div>
                    <div class="char-card" id="dino2-card">
                        <div class="char-preview" id="preview2"></div>
                        <div class="char-name">Dino Girl</div>
                    </div>
                </div>

                <div style="margin-top: 0.5rem;">
                    <button id="start-btn">Start Game</button>
                    <button id="music-toggle" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);">Music: OFF</button>
                </div>
                <p style="margin-top: 0.5rem; font-size: 0.8rem; opacity: 0.8;">Arrows to Move • Space to Shoot • Collect $20s!</p>
            </div>
            <div id="game-over-screen" class="screen">
                <h1>GAME OVER</h1>
                <p id="final-score">Your Score: 0</p>
                <button id="restart-btn">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const levelUpText = document.getElementById('level-up-text');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreText = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const dino1Card = document.getElementById('dino1-card');
        const dino2Card = document.getElementById('dino2-card');

        // Resize canvas
        canvas.width = 800;
        canvas.height = 400;

        // Game constants
        const GRAVITY = 0.8;
        const JUMP_STRENGTH = -16;
        const GROUND_HEIGHT = 60;
        const RAINBOW_COLORS = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#8B00FF'];

        // Game state
        let score = 0;
        let currentLevel = 1;
        let selectedDinoType = 1; // 1 for Boy, 2 for Girl
        let gameActive = false;
        let obstacles = [];
        let particles = [];
        let clouds = [];
        let projectiles = []; // Tacos
        let enemies = []; // Chickens
        let enemyProjectiles = []; // Nuggets
        let animationId;
        let gameSpeed = 6;
        let frameCount = 0;

        // Input state
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = true;
                if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });    // Character Selection Listeners
        dino1Card.addEventListener('click', () => {
            selectedDinoType = 1;
            dino1Card.classList.add('selected');
            dino2Card.classList.remove('selected');
        });

        dino2Card.addEventListener('click', () => {
            selectedDinoType = 2;
            dino2Card.classList.add('selected');
            dino1Card.classList.remove('selected');
        });

        function initPreviews() {
            const p1 = document.getElementById('preview1');
            const p2 = document.getElementById('preview2');
            p1.innerHTML = '<canvas id="c1" width="100" height="100"></canvas>';
            p2.innerHTML = '<canvas id="c2" width="100" height="100"></canvas>';

            const ctx1 = document.getElementById('c1').getContext('2d');
            const ctx2 = document.getElementById('c2').getContext('2d');

            // Draw Boy Dino Preview
            drawDinoPreview(ctx1, 1);
            // Draw Girl Dino Preview
            drawDinoPreview(ctx2, 2);
        }

        function drawDinoPreview(pCtx, type) {
            const color = type === 1 ? '#4CAF50' : '#E91E63';
            pCtx.save();
            pCtx.translate(15, 30);
            pCtx.scale(0.8, 0.8);

            // Body
            pCtx.fillStyle = color;
            pCtx.beginPath();
            if (pCtx.roundRect) {
                pCtx.roundRect(0, 0, 60, 60, 10);
            } else {
                pCtx.rect(0, 0, 60, 60);
            }
            pCtx.fill();

            // Head
            pCtx.beginPath();
            pCtx.ellipse(60, 0, 20, 15, 0, 0, Math.PI * 2);
            pCtx.fill();

            // Eye
            pCtx.fillStyle = 'white';
            pCtx.beginPath();
            pCtx.arc(70, -5, 5, 0, Math.PI * 2);
            pCtx.fill();
            pCtx.fillStyle = 'black';
            pCtx.beginPath();
            pCtx.arc(72, -5, 2, 0, Math.PI * 2);
            pCtx.fill();

            if (type === 2) {
                pCtx.strokeStyle = 'black';
                pCtx.lineWidth = 2;
                pCtx.beginPath();
                pCtx.arc(70, -5, 7, 0, Math.PI * 2);
                pCtx.stroke();
                pCtx.beginPath();
                pCtx.moveTo(63, -5);
                pCtx.lineTo(55, -5);
                pCtx.stroke();
            }

            // Legs
            pCtx.strokeStyle = type === 1 ? '#2E7D32' : '#880E4F';
            pCtx.lineWidth = 4;
            pCtx.beginPath();
            pCtx.moveTo(15, 60);
            pCtx.lineTo(15, 75);
            pCtx.stroke();
            pCtx.beginPath();
            pCtx.moveTo(40, 60);
            pCtx.lineTo(40, 75);
            pCtx.stroke();

            pCtx.restore();
        }

        class Cloud {
            constructor() {
                this.x = canvas.width + Math.random() * 200;
                this.y = 30 + Math.random() * 100;
                this.speed = 0.5 + Math.random() * 1;
                this.width = 60 + Math.random() * 40;
                this.height = 30 + Math.random() * 20;
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.height, 0, Math.PI * 2);
                ctx.arc(this.x + this.width * 0.3, this.y - 10, this.height * 0.8, 0, Math.PI * 2);
                ctx.arc(this.x + this.width * 0.6, this.y, this.height * 0.9, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Taco {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40; // Increased hitbox
                this.height = 30;
                this.speed = 12;
            }

            update() {
                this.x += this.speed;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = '#FFD54F';
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y + 15, 15, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(this.x + 10, this.y + 5, 20, 5);
                ctx.fillStyle = '#795548';
                ctx.fillRect(this.x + 13, this.y + 10, 14, 4);
                ctx.restore();
            }
        }

        class Chicken {
            constructor() {
                this.width = 50;
                this.height = 50;
                this.x = canvas.width + 100;
                this.y = 50 + Math.random() * 150;
                this.speed = 3 + Math.random() * 2;
                this.shootTimer = 0;
                this.health = 1;
            }

            update() {
                this.x -= this.speed;
                this.shootTimer++;
                if (this.shootTimer > 120 - (currentLevel * 8)) {
                    this.shoot();
                    this.shootTimer = 0;
                }
            }

            shoot() {
                enemyProjectiles.push(new ChickenNugget(this.x, this.y + 25));
            }

            draw() {
                ctx.save();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.ellipse(this.x + 25, this.y + 25, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y + 15, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x + 10, this.y + 5, 10, 5);
                ctx.fillStyle = 'orange';
                ctx.beginPath();
                ctx.moveTo(this.x + 5, this.y + 15);
                ctx.lineTo(this.x - 5, this.y + 18);
                ctx.lineTo(this.x + 5, this.y + 21);
                ctx.fill();
                ctx.restore();
            }
        }

        class ChickenNugget {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 25;
                this.height = 20;
                this.speed = 5 + (currentLevel * 0.5);
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                ctx.fillStyle = '#D2691E';
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(this.x, this.y, this.width, this.height, 5);
                } else {
                    ctx.rect(this.x, this.y, this.width, this.height);
                }
                ctx.fill();
            }
        }

        class Money {
            constructor() {
                this.width = 60;
                this.height = 30;
                this.x = canvas.width + 100;
                this.y = 50 + Math.random() * 200;
                this.speed = gameSpeed * 0.8;
                this.value = 20;
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = '#C8E6C9';
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(this.x, this.y, this.width, this.height, 3);
                } else {
                    ctx.rect(this.x, this.y, this.width, this.height);
                }
                ctx.fill();
                ctx.strokeStyle = '#2E7D32';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x + 2, this.y + 2, this.width - 4, this.height - 4);
                ctx.fillStyle = '#2E7D32';
                ctx.font = 'bold 14px Outfit';
                ctx.fillText('$20', this.x + 15, this.y + 20);
                ctx.restore();
            }
        }

        class River {
            constructor(color) {
                this.width = 120 + (currentLevel * 10); // Gets wider each level
                this.height = GROUND_HEIGHT;
                this.x = canvas.width + 200;
                this.y = canvas.height - GROUND_HEIGHT;
                this.color = color || '#03A9F4';
            }

            update() {
                this.x -= gameSpeed;
            }

            draw() {
                ctx.save();
                // River body
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Ripples
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    const ox = (this.x + (frameCount * 2 + i * 40) % this.width);
                    ctx.beginPath();
                    ctx.moveTo(ox, this.y + 10 + i * 15);
                    ctx.lineTo(ox + 20, this.y + 10 + i * 15);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        const RIVER_COLORS = [
            '#03A9F4', // Level 1: Blue
            '#FF5722', // Level 2: Orange
            '#9C27B0', // Level 3: Purple
            '#4CAF50', // Level 4: Green
            '#FFEB3B', // Level 5: Yellow
            '#E91E63', // Level 6: Pink
            '#00BCD4', // Level 7: Cyan
            '#795548', // Level 8: Brown
            '#607D8B', // Level 9: Grey
            '#000000'  // Level 10: Black
        ];

        // Audio System (Suno MP3 Integration)
        const music = new Audio('https://cdn1.suno.ai/74851bea-b515-4d70-a98c-e790a39458d2.mp3');
        music.loop = true;
        let isMusicPlaying = false;
        let musicToggle = document.getElementById('music-toggle');

        musicToggle.addEventListener('click', () => {
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) {
                music.play().catch(e => console.error("Audio play failed:", e));
                musicToggle.innerText = 'Music: ON';
                musicToggle.style.background = 'rgba(76, 175, 80, 0.4)'; // Greenish tint
            } else {
                music.pause();
                musicToggle.innerText = 'Music: OFF';
                musicToggle.style.background = 'rgba(255, 255, 255, 0.2)';
            }
        });

        class Dinosaur {
            constructor(type) {
                this.type = type;
                this.baseWidth = 60;
                this.baseHeight = 60;
                this.width = this.baseWidth;
                this.height = this.baseHeight;
                this.x = 100;
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.vy = 0;
                this.isJumping = false;
                this.isDucking = false;
                this.color = this.type === 1 ? '#4CAF50' : '#E91E63';
                this.legFrame = 0;
                this.shootCooldown = 0;
            }

            update() {
                if (keys.ArrowRight) this.x += 6;
                if (keys.ArrowLeft) this.x -= 6;

                if (this.x < 20) this.x = 20;
                if (this.x > canvas.width - this.width - 20) this.x = canvas.width - this.width - 20;

                if (keys.ArrowUp && !this.isJumping) {
                    this.vy = JUMP_STRENGTH;
                    this.isJumping = true;
                }

                if (keys.ArrowDown && !this.isJumping) {
                    this.isDucking = true;
                    this.height = 35;
                } else {
                    this.isDucking = false;
                    this.height = this.baseHeight;
                }

                if (this.shootCooldown > 0) this.shootCooldown--;
                if (keys.Space && this.shootCooldown === 0) {
                    this.shoot();
                    this.shootCooldown = 12;
                }

                this.vy += GRAVITY;
                this.y += this.vy;

                const groundY = canvas.height - GROUND_HEIGHT - this.height;
                if (this.y > groundY) {
                    this.y = groundY;
                    this.vy = 0;
                    this.isJumping = false;
                }

                if (!this.isJumping) {
                    this.legFrame = (this.legFrame + 0.2) % 2;
                }

                if (gameActive) {
                    this.spawnRainbow();
                }
            }

            shoot() {
                projectiles.push(new Taco(this.x + this.width, this.y + this.height * 0.4));
            }

            spawnRainbow() {
                const buttX = this.x + 5;
                const buttY = this.y + this.height * 0.6;

                RAINBOW_COLORS.forEach((color, index) => {
                    const offset = (index * 4) - 10;
                    particles.push(new Particle(buttX, buttY + offset, color));
                });
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(this.x, this.y, this.width, this.height, 10);
                } else {
                    ctx.rect(this.x, this.y, this.width, this.height);
                }
                ctx.fill();

                const headX = this.x + this.width - 10;
                const headY = this.isDucking ? this.y + 5 : this.y - 5;
                ctx.beginPath();
                ctx.ellipse(headX + 10, headY + 10, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(headX + 20, headY + 5, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(headX + 22, headY + 5, 2, 0, Math.PI * 2);
                ctx.fill();

                if (this.type === 2) {
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(headX + 20, headY + 5, 7, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(headX + 13, headY + 5);
                    ctx.lineTo(headX + 5, headY + 5);
                    ctx.stroke();
                }

                ctx.strokeStyle = this.type === 1 ? '#2E7D32' : '#880E4F';
                ctx.lineWidth = 4;
                const legOffset = Math.sin(this.legFrame * Math.PI) * 10;

                ctx.beginPath();
                ctx.moveTo(this.x + 15, this.y + this.height);
                ctx.lineTo(this.x + 15 + (this.isJumping ? 5 : legOffset), this.y + this.height + 10);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(this.x + 40, this.y + this.height);
                ctx.lineTo(this.x + 40 - (this.isJumping ? 5 : legOffset), this.y + this.height + 10);
                ctx.stroke();

                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.height - 10);
                ctx.quadraticCurveTo(this.x - 20, this.y + this.height - 20, this.x - 10, this.y + this.height - 35);
                ctx.lineTo(this.x, this.y + this.height - 25);
                ctx.fill();

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = 6;
                this.vx = -gameSpeed - (Math.random() * 1);
                this.vy = (Math.random() - 0.5) * 1.5;
                this.life = 1.0;
                this.decay = 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Obstacle {
            constructor() {
                const rand = Math.random();
                if (rand < 0.4) {
                    this.type = 'rock';
                    this.width = 40;
                    this.height = 30;
                    this.color = '#757575';
                } else if (rand < 0.8) {
                    this.type = 'cactus';
                    this.width = 30;
                    this.height = 60;
                    this.color = '#2E7D32';
                } else {
                    this.type = 'log';
                    this.width = 60;
                    this.height = 20;
                    this.color = '#5D4037';
                }

                this.x = canvas.width + 100;
                if (this.type === 'log') {
                    this.y = canvas.height - GROUND_HEIGHT - 65;
                } else {
                    this.y = canvas.height - GROUND_HEIGHT - this.height;
                }
            }

            update() {
                this.x -= gameSpeed;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                if (this.type === 'cactus') {
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(this.x + 10, this.y, 10, this.height, 5);
                    } else {
                        ctx.rect(this.x + 10, this.y, 10, this.height);
                    }
                    ctx.fill();
                    ctx.fillRect(this.x, this.y + 20, 20, 5);
                    ctx.fillRect(this.x, this.y + 15, 5, 10);
                    ctx.fillRect(this.x + 25, this.y + 10, 5, 10);
                } else if (this.type === 'rock') {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + this.height);
                    ctx.lineTo(this.x + this.width, this.y + this.height);
                    ctx.lineTo(this.x + this.width * 0.8, this.y);
                    ctx.lineTo(this.x + this.width * 0.2, this.y);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(this.x, this.y, this.width, this.height, 5);
                    } else {
                        ctx.rect(this.x, this.y, this.width, this.height);
                    }
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        let dino = new Dinosaur(1);
        let moneyItems = [];
        let rivers = [];
        let lastRiverLevel = 0;

        function spawnCloud() {
            if (Math.random() < 0.01) clouds.push(new Cloud());
        }

        function spawnMoney() {
            if (Math.random() < 0.008) {
                moneyItems.push(new Money());
            }
        }

        function spawnRiver() {
            // Spawn one river per level
            if (currentLevel > lastRiverLevel) {
                const color = RIVER_COLORS[currentLevel - 1] || '#03A9F4';
                rivers.push(new River(color));
                lastRiverLevel = currentLevel;
            }
        }

        function spawnEnemy() {
            if (currentLevel >= 2 && Math.random() < 0.005 + (currentLevel * 0.003)) {
                enemies.push(new Chicken());
            }
        }

        function spawnObstacle() {
            if (Math.random() < 0.01 + (currentLevel * 0.002)) {
                // Don't spawn obstacles too close to rivers
                let nearRiver = false;
                for (let r of rivers) {
                    if (r.x > canvas.width - 200) nearRiver = true;
                }
                if (!nearRiver && (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 300) &&
                    (enemies.length === 0 || enemies[enemies.length - 1].x < canvas.width - 300)) {
                    obstacles.push(new Obstacle());
                }
            }
        }

        function checkCollision(a, b) {
            const padding = 5;
            return (
                a.x + padding < b.x + b.width - padding &&
                a.x + a.width - padding > b.x + padding &&
                a.y + padding < b.y + b.height - padding &&
                a.y + a.height - padding > b.y + padding
            );
        }

        function checkLevelUp() {
            const nextLevel = Math.floor(score / 500) + 1;
            if (nextLevel > currentLevel && currentLevel < 10) {
                currentLevel = nextLevel;
                gameSpeed += 0.7;
                levelDisplay.innerText = `Level: ${currentLevel}`;
                showLevelUp();
            }
        }

        function showLevelUp() {
            levelUpText.classList.add('visible');
            setTimeout(() => levelUpText.classList.remove('visible'), 2000);
        }

        function resetGame() {
            score = 0;
            currentLevel = 1;
            lastRiverLevel = 0;
            gameSpeed = 6;
            obstacles = [];
            particles = [];
            clouds = [];
            projectiles = [];
            enemies = [];
            enemyProjectiles = [];
            moneyItems = [];
            rivers = [];
            dino = new Dinosaur(selectedDinoType);
            gameActive = true;
            scoreDisplay.innerText = `Score: 0`;
            levelDisplay.innerText = `Level: 1`;
            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            gameLoop();
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            gameOverScreen.classList.add('active');
            finalScoreText.innerText = `Your Score: ${Math.floor(score)}`;
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#4facfe');
            skyGrad.addColorStop(1, '#00f2fe');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            spawnCloud();
            for (let i = clouds.length - 1; i >= 0; i--) {
                clouds[i].update();
                clouds[i].draw();
                if (clouds[i].x + clouds[i].width < -100) clouds.splice(i, 1);
            }

            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 15);
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - GROUND_HEIGHT + 15, canvas.width, GROUND_HEIGHT - 15);

            ctx.fillStyle = '#2E7D32';
            for (let i = 0; i < canvas.width; i += 100) {
                const x = (i - (frameCount * gameSpeed)) % (canvas.width + 100);
                ctx.beginPath();
                ctx.moveTo(x, canvas.height - GROUND_HEIGHT);
                ctx.lineTo(x + 5, canvas.height - GROUND_HEIGHT - 5);
                ctx.lineTo(x + 10, canvas.height - GROUND_HEIGHT);
                ctx.fill();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            dino.update();
            dino.draw();

            spawnObstacle();
            spawnEnemy();
            spawnMoney();
            spawnRiver();

            // Rivers
            for (let i = rivers.length - 1; i >= 0; i--) {
                rivers[i].update();
                rivers[i].draw();

                // If dino is over the river and NOT jumping high enough, game over
                const dinoFootY = dino.y + dino.height;
                if (dino.x + dino.width > rivers[i].x + 10 &&
                    dino.x < rivers[i].x + rivers[i].width - 10) {
                    if (dinoFootY >= canvas.height - GROUND_HEIGHT) {
                        gameOver();
                    }
                }

                if (rivers[i].x + rivers[i].width < -100) rivers.splice(i, 1);
            }

            // Money
            for (let i = moneyItems.length - 1; i >= 0; i--) {
                moneyItems[i].update();
                moneyItems[i].draw();

                if (checkCollision(dino, moneyItems[i])) {
                    score += moneyItems[i].value;
                    moneyItems.splice(i, 1);
                } else if (moneyItems[i].x + moneyItems[i].width < -100) {
                    moneyItems.splice(i, 1);
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                projectiles[i].update();
                projectiles[i].draw();

                let tacoHit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (checkCollision(projectiles[i], enemies[j])) {
                        enemies.splice(j, 1);
                        tacoHit = true;
                        score += 50;
                        break;
                    }
                }

                if (!tacoHit) {
                    for (let k = enemyProjectiles.length - 1; k >= 0; k--) {
                        if (checkCollision(projectiles[i], enemyProjectiles[k])) {
                            enemyProjectiles.splice(k, 1);
                            tacoHit = true;
                            score += 10;
                            break;
                        }
                    }
                }

                if (tacoHit || (projectiles[i] && projectiles[i].x > canvas.width)) {
                    projectiles.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update();
                enemies[i].draw();
                if (checkCollision(dino, enemies[i])) gameOver();
                if (enemies[i].x + enemies[i].width < -100) enemies.splice(i, 1);
            }

            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                enemyProjectiles[i].update();
                enemyProjectiles[i].draw();
                if (checkCollision(dino, enemyProjectiles[i])) gameOver();
                if (enemyProjectiles[i] && enemyProjectiles[i].x + enemyProjectiles[i].width < -50) {
                    enemyProjectiles.splice(i, 1);
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();
                if (checkCollision(dino, obstacles[i])) gameOver();
                if (obstacles[i].x + obstacles[i].width < -50) obstacles.splice(i, 1);
            }

            score += 0.2;
            scoreDisplay.innerText = `Score: ${Math.floor(score)}`;
            checkLevelUp();

            frameCount++;
            animationId = requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', resetGame);

        // Initialize character previews with a slight delay to ensure DOM readiness
        window.addEventListener('load', initPreviews);
        // Also call immediately if already loaded
        if (document.readyState === 'complete') initPreviews();

    </script>
</body>
